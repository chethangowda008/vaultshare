<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<script src="js/theme-init.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — VaultShare</title>
<link rel="stylesheet" href="css/style.css"/>
<link rel="stylesheet" href="css/auth.css"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
<div class="orb2"></div>

<header>
  <div class="logo">
    <div class="logo-icon">🔐</div>
    Vault<span>Share</span>
  </div>
  <div class="badge">AES-256-GCM</div>
  <button class="theme-toggle" id="theme-toggle-btn" onclick="cycleTheme()" aria-label="Toggle color theme" title="Toggle dark / light / system theme">🖥️ System</button>
</header>

<main class="auth-main">
  <div class="auth-wrap">
    <div class="hero">
      <h1>Welcome <em>Back</em></h1>
      <p>Log in to access your Personal Vault.</p>
    </div>

    <div class="card auth-card">
      <div class="card-title"><div class="dot"></div> Login</div>

      <div id="auth-error" class="auth-alert" style="display:none;"></div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required/>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" required/>
            <button type="button" class="eye-btn" data-toggle="password">👁</button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">Login</button>
      </form>

      <div class="auth-switch">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </div>
</main>

<footer>VaultShare — All crypto runs in your browser. Open source. Zero telemetry.</footer>
<div class="toast" id="toast"></div>

<script src="js/auth.js"></script>
</body>
</html>
