# =====================================================================
#  VaultShare — docker-compose.yml
#  Runs the app + Nginx reverse proxy.
#
#  Usage:
#    docker-compose up -d              # Start in background
#    docker-compose logs -f            # Follow logs
#    docker-compose down               # Stop
#    docker-compose down -v            # Stop + remove volumes
# =====================================================================

version: '3.9'

services:

  # ── Node.js Application ──────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: vaultshare-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - vaultshare-net

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: vaultshare-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro   # SSL certificates
      - /var/www/certbot:/var/www/certbot:ro    # ACME challenge
    depends_on:
      app:
        condition: service_healthy
    networks:
      - vaultshare-net

networks:
  vaultshare-net:
    driver: bridge
